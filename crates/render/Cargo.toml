[package]
name = "solidcraft-render"
description = "SolidCraft view math (orbit camera, projection, picking rays), the description of headless pictures, and product render jobs"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
raytrace-cpu = ["dep:rayon", "solidcraft-viewport/raytrace-cpu"]

[dependencies]
solidcore-record = { workspace = true }
solidcore-tess = { workspace = true }
solidcraft-color = { workspace = true }
solidcraft-viewport = { workspace = true }
solidcraft-geom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true, features = ["jpeg"] }
moxcms = { workspace = true }
png = { workspace = true }
robust = { workspace = true }
sha2 = { workspace = true }
web-time = { workspace = true }
weezl = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true, optional = true }
sysinfo = { workspace = true }

[dev-dependencies]
# Texture sources' storage checks for the job tests (test-only; `cargo xtask layers` refuses it
# anywhere but a dev-dependency).
solidcraft-viewport = { workspace = true, features = ["test-reference"] }
flate2 = "1"

[[example]]
name = "cpu_resource_smoke"
required-features = ["raytrace-cpu"]
