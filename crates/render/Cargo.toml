[package]
name = "solidcraft-render"
description = "SolidCraft view math (orbit camera, projection, picking rays), the description of headless pictures, and product render jobs"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
raytrace-cpu = []
# The test-only f64 reference interpreter of material graphs (`material_graph::reference`), for
# the GPU back ends' tests. Only dev-dependencies may enable it: `cargo xtask layers` refuses a
# normal or build dependency, or a feature, that does.
test-reference = ["dep:serde_json"]

[dependencies]
solidcraft-geom = { workspace = true }
serde = { workspace = true }
image = { workspace = true, features = ["jpeg"] }
moxcms = { workspace = true }
png = { workspace = true }
sha2 = { workspace = true }
web-time = { workspace = true }
weezl = { workspace = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[[example]]
name = "cpu_resource_smoke"
required-features = ["raytrace-cpu"]
