[package]
name = "solidcraft-render"
description = "SolidCraft view math (orbit camera, projection, picking rays), the description of headless pictures, and product render jobs"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
raytrace-cpu = ["dep:robust"]
# Test-only f64 references for the GPU back ends' tests: the material-graph interpreter
# (`material_graph::reference`) and the tinted-coat oracle (`clear_coat::tinted_coat_brdf`). Only dev-dependencies may enable it: `cargo xtask layers` refuses a
# normal or build dependency, or a feature, that does.
test-reference = []

[dependencies]
solidcore-record = { workspace = true }
solidcraft-geom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true, features = ["jpeg"] }
moxcms = { workspace = true }
png = { workspace = true }
robust = { workspace = true, optional = true }
sha2 = { workspace = true }
web-time = { workspace = true }
weezl = { workspace = true }

[dev-dependencies]
flate2 = "1"

[[example]]
name = "cpu_resource_smoke"
required-features = ["raytrace-cpu"]
