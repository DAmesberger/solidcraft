[package]
name = "solidcraft-viewport-gpu"
description = "The viewport renderer's GPU work the Craft apps share, on wgpu: the viewport's pipelines, offscreen pictures, adapter selection and display plans evaluated in a compute shader"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
log = { workspace = true }
serde = { workspace = true }
solidcore-record = { workspace = true }
solidcore-tess = { workspace = true }
solidcraft-color = { workspace = true }
solidcraft-viewport = { workspace = true }
thiserror = { workspace = true }
wgpu = { workspace = true }
# Material-graph shapes are validated before a pipeline is made: a failure is a value (§5.1).
naga = { workspace = true, features = ["wgsl-in"] }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }
# Native backends, so tests and command-line hosts can open a device without a window.
wgpu = { workspace = true, features = ["metal", "vulkan", "dx12", "gles"] }

[dev-dependencies]
# The HLSL the D3D12 backend compiles (tests check it suits FXC), and the GLSL ES of WebGL2.
naga = { workspace = true, features = ["wgsl-in", "hlsl-out", "glsl-out"] }
# The material graph's f64 reference interpreter: the oracle the shading tests compare their
# readbacks with. Test-only; `cargo xtask layers` refuses it anywhere but a dev-dependency.
solidcraft-viewport = { workspace = true, features = ["test-reference"] }
image = { workspace = true }
serde_json = { workspace = true }
