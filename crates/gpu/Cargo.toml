[package]
name = "solidcraft-gpu"
description = "SolidCraft GPU rendering: the viewport's render pipelines, offscreen captures, and display tessellation plans evaluated in a compute shader"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
robust = "1.2"
solidcraft-geom = { workspace = true }
solidcraft-render = { workspace = true }
wgpu = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
# Material-graph shapes are validated before a pipeline is made: a failure is a value (§5.1).
naga = { workspace = true, features = ["wgsl-in"] }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
robust = { workspace = true }
pollster = { workspace = true }
# Native backends, so tests and the CLI can open a device without a window.
wgpu = { workspace = true, features = ["metal", "vulkan", "dx12", "gles"] }

[dev-dependencies]
image = { workspace = true }
solidcraft-kernel = { workspace = true }
# Headless pictures of real designs (capture tests).
solidcraft-engine = { workspace = true, features = ["bundled-render-library"] }
solidcraft-io = { workspace = true }
serde_json = { workspace = true }
# The HLSL the D3D12 backend compiles (tests check it suits FXC), and the GLSL ES of WebGL2.
naga = { workspace = true, features = ["wgsl-in", "hlsl-out", "glsl-out"] }
# The material graph's f64 reference interpreter: the oracle both back ends' tests compare their
# readbacks with. Test-only; `cargo xtask layers` refuses it anywhere but a dev-dependency.
solidcraft-render = { workspace = true, features = ["test-reference"] }
